name: Knowledge System Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry, claims, privacy patterns, links, and product sources
        run: python3 scripts/sync_audit.py --json | tee knowledge-audit.json
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-audit
          path: knowledge-audit.json
